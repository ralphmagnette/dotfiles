# ~/.config/herdr/config.toml
# Keybindings mirror tmux/.config/tmux/tmux.conf. Full reference: herdr --default-config

onboarding = false

[theme]
name = "catppuccin"

[terminal]
new_cwd = "follow"

[keys]
# Use Ctrl+a as prefix (instead of default Ctrl+b)
prefix = "ctrl+a"

# Reload config (herdr default is prefix+shift+r)
reload_config = "prefix+r"

# Splits: v = side by side, s = stacked
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
# prefix+s is the herdr default for settings
settings = "prefix+shift+s"

# Navigate panes (vim-style)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Resize panes (herdr has no repeat flag; use resize_mode for repeated steps)
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
resize_mode = "prefix+m"

# New window -> new tab
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"

# Kill pane/window
close_pane = "prefix+x"
close_tab = ["prefix+shift+x", "prefix+ampersand"]

zoom = "prefix+z"

# tmux defaults: o / 0 = next pane, ; = last pane, , = rename window, $ = rename session
cycle_pane_next = ["prefix+o", "prefix+0"]
last_pane = "prefix+semicolon"
rename_tab = "prefix+comma"
rename_workspace = "prefix+shift+4"
detach = "prefix+d"

[ui]
accent = "#89b4fa"
# tmux creates windows immediately without asking for a name
prompt_new_tab_name = false
